[package]
name = "aac-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Only drill binaries pause inside store operations.
parity-fixtures = ["aac-store/parity-fixtures"]

[lints]
workspace = true

[dependencies]
aac-api.workspace = true
aac-diag.workspace = true
aac-files.workspace = true
aac-log.workspace = true
aac-num.workspace = true
aac-core.workspace = true
aac-config.workspace = true
aac-protocol.workspace = true
aac-transport.workspace = true
aac-providers.workspace = true
aac-views.workspace = true
aac-store.workspace = true
aac-status.workspace = true
aac-renewal.workspace = true
aac-claude-renew.workspace = true
aac-snapshot.workspace = true
aac-agent = { path = "../aac-agent" }
aac-usage = { path = "../../native/aac-usage" }
base64 = "0.22"
indexmap = "2.14.2"
libc.workspace = true
# The service binaries' global allocator: glibc arenas retained multi-GB of freed
# compose transients as RSS (service-memory lane); mimalloc hands pages back.
mimalloc = "0.1"
serde.workspace = true
serde_yaml.workspace = true
serde_json = { workspace = true, features = ["raw_value", "preserve_order", "float_roundtrip"] }
tokio = { workspace = true, features = ["fs", "net", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["io"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
futures-util = { version = "0.3", default-features = false }
# Model pricing (G15) and the CLI's local store API fallback.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
sha2.workspace = true
sha1.workspace = true
flate2 = "1"
zstd = "0.14"
subtle = "2.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "std"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
bcrypt = "0.19"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz.workspace = true
getrandom = "0.4"
hmac = "0.13"
httpdate = "1"
if-addrs = "0.15"
ipnet = "2"
regex = { workspace = true, features = ["unicode-gencat"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
url = "2"
tempfile.workspace = true
# Imports the retired Cursor billing SQLite file from its verified bytes in memory (no file open).
# aac-status already links the bundled SQLite; `serialize` adds sqlite3_deserialize.
rusqlite = { version = "0.37", features = ["serialize"] }

[dev-dependencies]
aac-renewal = { workspace = true, features = ["parity-fixtures"] }
tokio-tungstenite = "0.29"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_SystemInformation"] }

[build-dependencies]
serde_json.workspace = true
