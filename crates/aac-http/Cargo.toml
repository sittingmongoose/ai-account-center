[package]
name = "aac-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aac-api.workspace = true
aac-diag.workspace = true
aac-files.workspace = true
aac-core.workspace = true
aac-providers.workspace = true
aac-views.workspace = true
aac-store = { path = "../../native/aac-store", default-features = false }
aac-status = { path = "../../native/aac-status", default-features = false }
base64 = "0.22"
libc.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value", "preserve_order"] }
tokio = { workspace = true, features = ["net", "signal", "sync", "time"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
futures-util = { version = "0.3", default-features = false }
sha2.workspace = true
subtle = "2.6"
tracing = "0.1"

[dev-dependencies]
tempfile.workspace = true
