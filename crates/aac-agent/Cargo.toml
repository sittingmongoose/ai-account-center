[package]
name = "aac-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
parity-fixtures = []

[dependencies]
aac-core.workspace = true
aac-files.workspace = true
aac-num.workspace = true
aac-protocol.workspace = true
aac-providers.workspace = true
aac-usage = { path = "../../native/aac-usage" }
aac-status.workspace = true
fs2.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tokio-tungstenite = "0.29"
tempfile.workspace = true
serde.workspace = true
mimalloc = "0.1"
serde_json = { workspace = true, features = ["preserve_order", "raw_value"] }
tokio = { workspace = true, features = ["fs"] }
libc.workspace = true
regex = { workspace = true, features = ["unicode-perl"] }
sha2.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
base64 = "0.22"
flate2 = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
rusqlite = { version = "0.37", features = ["bundled"] }
unicode-normalization = "0.1"
url = "2.5"
# Already in the lock through rustls: AES-256-GCM and PBKDF2 for the Claude Desktop caches.
ring = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process", "term", "poll", "user"] }

[dev-dependencies]
aac-config.workspace = true
aac-transport.workspace = true
sha2.workspace = true
tempfile.workspace = true

[lints]
workspace = true
