[package]
name = "aac-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
parity-fixtures = []

[dependencies]
aac-core.workspace = true
aac-files.workspace = true
aac-num.workspace = true
aac-protocol.workspace = true
aac-providers.workspace = true
aac-usage = { path = "../../native/aac-usage" }
aac-status.workspace = true
tempfile.workspace = true
serde.workspace = true
mimalloc = "0.1"
serde_json = { workspace = true, features = ["preserve_order", "raw_value"] }
tokio.workspace = true
libc.workspace = true
regex.workspace = true
sha2.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
unicode-normalization = "0.1"
url = "2.5"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process"] }

[dev-dependencies]
aac-config.workspace = true
aac-transport.workspace = true
sha2.workspace = true
tempfile.workspace = true

[lints]
workspace = true
