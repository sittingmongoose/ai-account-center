[package]
name = "aac-store"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
description = "AI Account Center storage library: append-only event log projected into redb (docs/store.md)"
repository = "https://github.com/sittingmongoose/ai-account-center"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["node"]
# Fixture-only crash checkpoints; absent from shipped builds.
parity-fixtures = []
# The Node binding. `cargo test --no-default-features` tests the store without it.
node = ["dep:napi", "dep:napi-derive"]

# Deliberately no `[lints] workspace = true` yet: this crate joined the workspace in R3 with
# its standalone lint state (its own `store:check` gate). Aligning it with the workspace's
# missing-docs and no-unwrap rules is separate work, not part of the move.
[dependencies]
redb = "=4.5.0"
napi = { version = "3", optional = true }
napi-derive = { version = "3", optional = true }
zstd = "0.14"
crc32fast = "1.5"
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
aac-core.workspace = true
aac-num.workspace = true

[build-dependencies]
napi-build = "2"
