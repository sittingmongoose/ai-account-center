[package]
name = "aac-views"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Read-route projections and screen view models composed in Rust (M3, D7)"

[lints]
workspace = true

[dependencies]
aac-api.workspace = true
aac-core.workspace = true
aac-num.workspace = true
aac-providers.workspace = true
aac-status.workspace = true
serde.workspace = true
# preserve_order: objects keep JavaScript insertion order; float_roundtrip: every number parses
# to the double JSON.parse reads (both are the M3 read-route settings of aac-http/aac-status).
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }

[dev-dependencies]
tempfile.workspace = true
