[package]
name = "aac-renewal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Saved-login renewal: Codex idle-login timer, Antigravity live-login renewal guards, Claude renewal reader"


[features]
# The cross-language parity runner and its fake-credential fixtures.
parity-fixtures = ["dep:tempfile"]

[[bin]]
name = "renewal_parity"
required-features = ["parity-fixtures"]

[[test]]
name = "parity"
required-features = ["parity-fixtures"]

[dependencies]
aac-files.workspace = true
tempfile = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
serde_yaml.workspace = true
sha2.workspace = true
base64 = "0.22"
regex = { workspace = true, features = ["unicode-perl"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tracing = "0.1"
tokio = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
