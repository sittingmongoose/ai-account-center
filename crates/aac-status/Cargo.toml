[package]
name = "aac-status"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
description = "AI Account Center status readers: T3 pinned threads and agent-reports/status@1"
repository = "https://github.com/sittingmongoose/ai-account-center"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["node"]
# The Node binding. `cargo test --no-default-features` tests the readers without it.
node = ["dep:napi", "dep:napi-derive"]

# Deliberately no `[lints] workspace = true` yet: this crate joined the workspace in R3 with
# its standalone lint state (its own `status:check` gate). Aligning it with the workspace's
# missing-docs and no-unwrap rules is separate work, not part of the move.
[dependencies]
# L3: the one numeric layer (ECMAScript, Intl and Python number and date semantics).
aac-num.workspace = true
# L2: the one file policy. The saved Codex login is read through aac_files::read.
aac-files.workspace = true
napi = { version = "3", optional = true }
napi-derive = { version = "3", optional = true }
base64 = "0.22"
rusqlite = { version = "0.37", features = ["bundled"] }
serde.workspace = true
# float_roundtrip: numbers parse to the exact double every JavaScript engine reads (the
# golden pairs carry 17-digit shares; the fast parser lands one ulp off them).
# preserve_order: parsed objects keep JavaScript insertion order (the share readers'
# projections copy raw members in the order JSON.parse holds them).
serde_json = { workspace = true, features = ["float_roundtrip", "preserve_order"] }
# The shared report secret policy (native/shared/secret_policy.rs), as aac-store compiles it.
regex.workspace = true
sha2.workspace = true
# Insertion-ordered maps for the share readers' state (serde_json's Map holds JSON values only).
indexmap = "2.14.2"
# R4: Ed25519 answer signing, interoperable with Node's crypto (PKCS#8 private, SPKI public, PEM).
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core"] }
pkcs8 = { version = "0.10", features = ["pem"] }
spki = { version = "0.7", features = ["pem"] }
pem-rfc7468 = { version = "0.7", features = ["alloc"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[target.'cfg(unix)'.dependencies]
# G16b: the answer store's writer lock (kill(pid, 0), gethostname).
libc.workspace = true

[build-dependencies]
napi-build = "2"

[dev-dependencies]
tempfile.workspace = true
