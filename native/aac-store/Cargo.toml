[package]
name = "aac-store"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
description = "AI Account Center storage library: append-only event log projected into redb (docs/store.md)"
repository = "https://github.com/sittingmongoose/ai-account-center"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["node"]
# The Node binding. `cargo test --no-default-features` tests the store without it.
node = ["dep:napi", "dep:napi-derive"]

[dependencies]
redb = "=4.5.0"
napi = { version = "3", optional = true }
napi-derive = { version = "3", optional = true }
zstd = "0.14"
crc32fast = "1.5"
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
opt-level = 3
strip = true
codegen-units = 1
