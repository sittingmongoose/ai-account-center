; Retired compatibility config for hosts that already provide supervisord.
; The canonical Docker image uses its direct dashboard entrypoint instead.
; No CLIProxy process or account/credential bootstrap is started here.
[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid
loglevel=info

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:ccs-dashboard]
command=/usr/local/bin/ai-account-center-entrypoint ai-account-center dashboard --host 0.0.0.0 --port 3000 --no-open
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
