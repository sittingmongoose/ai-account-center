# Compatibility filename for the former dashboard Compose deployment.
# New installations use docker/compose.yaml. Existing service/volume names stay.
services:
  ccs-dashboard:
    image: ${CCS_IMAGE:-ai-account-center:local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "${CCS_DOCKER_BIND_HOST:-127.0.0.1}:${CCS_DASHBOARD_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - CCS_DEBUG
      - NO_COLOR
      - CCS_DASHBOARD_AUTH_ENABLED
      - CCS_DASHBOARD_USERNAME
      - CCS_DASHBOARD_PASSWORD_HASH
      - CCS_SESSION_SECRET
    volumes:
      - ccs_home:/home/node/.ccs
    # The canonical image healthcheck probes only the dashboard entry point.
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2'
        reservations:
          memory: 256M
          cpus: '0.5'

volumes:
  ccs_home:
  # Former CLI volumes are retained as declarations for migration/rollback.
  # They are not mounted and no CLI tools are installed or started.
  claude_home:
  opencode_home:
  grok_home:
