# Compatibility filename for existing integrated deployments. CLIProxy is
# retired; this retains deployment identity and builds the dashboard source.
services:
  ccs-cliproxy:
    image: ${CCS_IMAGE:-ai-account-center:local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ccs-cliproxy
    restart: unless-stopped
    init: true
    ports:
      - "${CCS_DOCKER_BIND_HOST:-127.0.0.1}:${CCS_DASHBOARD_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - CCS_DEBUG
      - NO_COLOR
      - CCS_DASHBOARD_AUTH_ENABLED
      - CCS_DASHBOARD_USERNAME
      - CCS_DASHBOARD_PASSWORD_HASH
      - CCS_SESSION_SECRET
    volumes:
      - ccs_home:/home/node/.ccs
    # Dashboard healthcheck is inherited from the canonical image.

volumes:
  ccs_home:
  ccs_logs:
