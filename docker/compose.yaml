# AI Account Center: build and run this checkout's Slint dashboard.
# From the repository root: docker compose -f docker/compose.yaml up -d --build
# Port 3000 is published on loopback by default. Host credentials and SSH
# configuration require explicit mounts; this file does not import host logins.
services:
  # Keep the former service and volume identities for existing installations.
  ccs:
    image: ${CCS_IMAGE:-ai-account-center:local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "${CCS_DOCKER_BIND_HOST:-127.0.0.1}:${CCS_DASHBOARD_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - CCS_DEBUG
      - NO_COLOR
      # Unset values stay unset, preserving authentication saved in .ccs.
      - CCS_DASHBOARD_AUTH_ENABLED
      - CCS_DASHBOARD_USERNAME
      - CCS_DASHBOARD_PASSWORD_HASH
      - CCS_SESSION_SECRET
    volumes:
      - ccs_home:/home/node/.ccs
    networks:
      - ccs-net
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const http=require('http');
          const req=http.get('http://127.0.0.1:3000/',res=>{res.resume();process.exit(res.statusCode===200?0:1);});
          req.on('error',()=>process.exit(1));
          req.setTimeout(4500,()=>{req.destroy();process.exit(1);});
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  ccs_home:
  # Retain the old declaration for migration/rollback; current logs use Docker.
  ccs_logs:

networks:
  ccs-net:
    name: ccs-net
