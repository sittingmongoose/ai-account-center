# AI Account Center: package and run a gated Linux release tarball in Docker.
# From the repository root:
#   AAC_RELEASE_DIR=/path/to/release/linux AAC_BUILD_COMMIT=<40-hex-sha> \
#     docker compose -f docker/compose.yaml up -d --build
# Port 3000 is published on loopback by default. Host credentials and SSH
# configuration require explicit mounts; this file does not import host logins.
services:
  # Keep the former service and volume identities for existing installations.
  ccs:
    image: ${CCS_IMAGE:-ai-account-center:local}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      additional_contexts:
        release: ${AAC_RELEASE_DIR:?Set AAC_RELEASE_DIR to the directory containing the gated Linux release .tgz}
      args:
        AAC_BUILD_COMMIT: ${AAC_BUILD_COMMIT:?Set AAC_BUILD_COMMIT to the gated release commit SHA}
        AAC_RELEASE_TGZ: ${AAC_RELEASE_TGZ:-sittingmongoose-ai-account-center-8.10.0.tgz}
        AAC_RELEASE_SHA256: ${AAC_RELEASE_SHA256:-}
    restart: unless-stopped
    init: true
    ports:
      - "${CCS_DOCKER_BIND_HOST:-127.0.0.1}:${CCS_DASHBOARD_PORT:-3000}:3000"
    environment:
      - CCS_DEBUG
      - NO_COLOR
      # Unset values stay unset, preserving authentication saved in .ccs.
      - CCS_DASHBOARD_AUTH_ENABLED
      - CCS_DASHBOARD_USERNAME
      - CCS_DASHBOARD_PASSWORD_HASH
      - CCS_SESSION_SECRET
    volumes:
      - ccs_home:/home/node/.ccs
    networks:
      - ccs-net
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --output
        - /dev/null
        - --max-time
        - "4"
        - http://127.0.0.1:3000/api/health
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  ccs_home:
  # Retain the old declaration for migration/rollback; current logs use Docker.
  ccs_logs:

networks:
  ccs-net:
    name: ccs-net
