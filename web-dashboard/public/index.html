<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>AI Account Center</title><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><style>
:root{--bg:#ECF0F3;--ink:#63717F}@media (prefers-color-scheme:dark){:root{--bg:#0C1217;--ink:#8794A2}}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,sans-serif}#canvas{width:100%;height:100%;display:block;outline:none}#loading{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;color:var(--ink);background:var(--bg);font-size:14px}#loading img{width:36px;height:36px}#loading[hidden]{display:none}
#aac-login{position:fixed;left:0;top:0;z-index:0;opacity:.01;pointer-events:none;margin:0;padding:0}#aac-login input[type=text],#aac-login input[type=password]{width:200px;height:28px;border:0;padding:0}#aac-login input[type=checkbox]{width:14px;height:14px;border:0;padding:0}
</style><script>try{var t=localStorage.getItem('aac-theme')||localStorage.getItem('ccs-slint-theme');if(t==='dark'||t==='light')document.documentElement.style.setProperty('--bg',t==='dark'?'#0C1217':'#ECF0F3')}catch(e){}</script></head><body><canvas id="canvas" tabindex="0" aria-label="AI Account Center built with Slint"></canvas><div id="loading" role="status"><img src="/assets/aac-logo.svg" alt=""><span>Loading AI Account Center…</span></div><form id="aac-login" method="post" action="/api/auth/login" autocomplete="on" aria-hidden="true"><input id="aac-login-user" type="text" name="username" autocomplete="username" tabindex="-1" aria-hidden="true"><input id="aac-login-pass" type="password" name="current-password" autocomplete="current-password" tabindex="-1" aria-hidden="true"><input id="aac-login-remember" type="checkbox" name="remember-me" checked tabindex="-1" aria-hidden="true"><button id="aac-login-submit" type="submit" tabindex="-1" aria-hidden="true">Sign in</button></form><script type="module" src="/bridge.js"></script></body></html>
