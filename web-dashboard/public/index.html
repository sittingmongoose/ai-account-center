<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"><meta name="color-scheme" content="light dark"><meta name="theme-color" content="#ECF0F3"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="AAC"><title>AI Account Center</title><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180-v2.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon-180-v2.png"><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><link rel="preload" href="/assets/InstrumentSans.ttf" as="font" type="font/ttf" crossorigin><link rel="preload" href="/assets/AACMask.ttf" as="font" type="font/ttf" crossorigin><style>
:root{--bg:#ECF0F3;--ink:#63717F}@media (prefers-color-scheme:dark){:root{--bg:#0C1217;--ink:#8794A2}}
html,body{position:fixed;inset:0;margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);font-family:system-ui,sans-serif;-webkit-text-size-adjust:100%}
#canvas{position:fixed;inset:0;left:0;top:0;width:100%!important;height:100%!important;min-width:0!important;min-height:0!important;max-width:none!important;max-height:none!important;display:block;outline:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}#viewport-probe{position:fixed;inset:0;left:0;top:0;width:100%;height:100%;pointer-events:none;visibility:hidden;z-index:-1}
#loading{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--ink);background:var(--bg);font-size:15px;padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(16vh + env(safe-area-inset-bottom)) env(safe-area-inset-left)}#loading img{width:56px;height:56px}#loading[hidden]{display:none}
/* Slint's own text fields are driven by one hidden <input> it appends to the body (absolute, opacity 0,
z-index -1, sized to the canvas, no font-size): iOS zooms on focus below 16 px, so force 16 px here.
The login form's inputs live inside #aac-login, never as direct body children, so this only hits Slint's. */
body>input{font-size:16px!important}
@font-face{font-family:"AAC Field";src:url(/assets/InstrumentSans.ttf) format("truetype");font-weight:400 700;font-style:normal;font-display:block;unicode-range:U+0-2021,U+2023-25CE,U+25D0-10FFFF}@font-face{font-family:"AAC Field";src:url(/assets/AACMask.ttf) format("truetype");font-weight:400 700;font-style:normal;font-display:block;unicode-range:U+2022,U+25CF}
#aac-login{position:fixed;left:0;top:0;width:0;height:0;margin:0;padding:0;border:0;z-index:1;pointer-events:none;--aac-login-size:13.5px;--aac-login-ink:#15202B;--aac-login-placeholder:#95A2AE;--aac-login-selection:rgba(37,82,204,.25);--aac-login-accent:#2552CC}
#aac-login>input,#aac-login>button{position:absolute;display:none;box-sizing:border-box;margin:0;border:0;border-radius:0;outline:0;box-shadow:none;background:transparent;-webkit-appearance:none;appearance:none}
#aac-login>#aac-login-user,#aac-login>#aac-login-pass,#aac-login>#aac-login-pass2,#aac-login>#aac-login-code{pointer-events:auto;border-radius:10px;padding-top:0;padding-bottom:0;font:400 var(--aac-login-size)/normal "AAC Field",system-ui,sans-serif;letter-spacing:0;text-indent:0;color:var(--aac-login-ink);-webkit-text-fill-color:var(--aac-login-ink);caret-color:var(--aac-login-ink);cursor:text}
#aac-login>input::placeholder{color:var(--aac-login-placeholder);-webkit-text-fill-color:var(--aac-login-placeholder);opacity:1}
#aac-login>input::selection{background:var(--aac-login-selection);color:var(--aac-login-ink);-webkit-text-fill-color:var(--aac-login-ink)}
#aac-login>#aac-login-pass,#aac-login>#aac-login-pass2{border-radius:10px 0 0 10px}
 /* the inputs paint only their text over the Slint boxes: no manager highlight (1Password's data-com-onepassword-filled), no autofill colour, border, outline or shadow (status/FW4-LOGIN-FILL.md) */
#aac-login>#aac-login-user,#aac-login>#aac-login-pass,#aac-login>#aac-login-pass2,#aac-login>#aac-login-code{background-color:transparent!important;background-image:none!important;-webkit-background-clip:text!important;background-clip:text!important;border:0!important;outline:0!important;box-shadow:none!important;animation:none!important}
#aac-login>input:-webkit-autofill{-webkit-text-fill-color:var(--aac-login-ink)!important;caret-color:var(--aac-login-ink)!important;transition:background-color 100000s 0s,color 100000s 0s!important}
#aac-login>input:autofill{-webkit-text-fill-color:var(--aac-login-ink)!important;caret-color:var(--aac-login-ink)!important;transition:background-color 100000s 0s,color 100000s 0s!important}
#aac-login>input::-ms-reveal,#aac-login>input::-ms-clear{display:none}
#aac-login>#aac-login-remember,#aac-login>#aac-login-submit{padding:0;color:transparent;font-size:0;pointer-events:none}
#aac-login>#aac-login-remember:focus-visible{outline:2px solid var(--aac-login-accent);outline-offset:2px;border-radius:5px}#aac-login>#aac-login-submit:focus-visible{outline:2px solid var(--aac-login-accent);outline-offset:2px;border-radius:12px}
</style><script>try{var t=localStorage.getItem('aac-theme')||localStorage.getItem('ccs-slint-theme');var d=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.style.setProperty('--bg',d?'#0C1217':'#ECF0F3');document.documentElement.style.setProperty('--ink',d?'#8794A2':'#63717F');var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',d?'#0C1217':'#ECF0F3')}catch(e){}</script></head><body><div id="viewport-probe" aria-hidden="true"></div><canvas id="canvas" tabindex="0" aria-label="AI Account Center built with Slint"></canvas><div id="loading" role="status"><img src="/assets/aac-logo.svg" alt=""><span>Loading AI Account Center…</span></div><form id="aac-login" method="post" action="/api/auth/login" autocomplete="on"><input id="aac-login-user" type="text" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next" aria-label="Username"><input id="aac-login-pass" type="password" name="password" autocomplete="current-password" enterkeyhint="go" aria-label="Password"><input id="aac-login-pass2" type="password" name="password-confirm" autocomplete="new-password" enterkeyhint="next" aria-label="Confirm password"><input id="aac-login-code" type="text" name="setup-code" autocomplete="one-time-code" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Setup code"><input id="aac-login-remember" type="checkbox" name="remember-me" checked aria-label="Remember me"><button id="aac-login-submit" type="submit">Sign in</button></form><script type="module" src="/bridge.js"></script></body></html>
