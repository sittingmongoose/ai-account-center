[package]
name = "ccs-account-dashboard"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
build = "build.rs"
publish = false
description = "AI Account Center account and subscription usage dashboard built with Slint"
repository = "https://github.com/sittingmongoose/ai-account-center"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "compat-1-2"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
lto = true
opt-level = "s"
strip = true

[package.metadata.wasm-pack.profile.release]
# Rust 1.98 emits instructions unsupported by wasm-pack 0.13.1's bundled wasm-opt.
# Rust release optimization and LTO remain enabled.
# N9 (2026-10-05): binaryen v133 with explicit --enable-* flags does run, but the wire
# bytes grow (br11 2.268 -> 2.359 MB, +4.0%; -Oz: +4.4%) while raw shrinks, so serving
# the unoptimized build stays the faster cold load. Keep wasm-opt off.
wasm-opt = false
