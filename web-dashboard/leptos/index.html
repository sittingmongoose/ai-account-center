<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AAC" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ECF0F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0C1217" media="(prefers-color-scheme: dark)" />
    <title>AI Account Center</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <!-- iOS's Add to Home Screen icon (the start page is this page since the classic one went). -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180-v2.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180-v2.png" />
    <script>if(self!==top||/[?&]embed=1(&|$)/.test(location.search))document.documentElement.setAttribute('data-status-embedded','1');</script>
    <!-- Chromium's install prompt can come before any module has loaded: it is kept for Settings' "Install app"
    (public/frame-dashboard.mjs), which says so with an `aac-install` event, as is an install made meanwhile. -->
    <script>addEventListener('beforeinstallprompt',function(e){e.preventDefault();window.__aacInstallPrompt=e;dispatchEvent(new Event('aac-install'))});addEventListener('appinstalled',function(){window.__aacInstallPrompt=null;dispatchEvent(new Event('aac-install'))});</script>
    <link rel="stylesheet" href="/status-bar.css" />
    <link rel="stylesheet" href="{{CSS}}" />
    <link rel="modulepreload" href="{{PKG}}/aac_web.js" />
    <link rel="preload" href="{{PKG}}/aac_web_bg.wasm" as="fetch" type="application/wasm" crossorigin />
  </head>
  <body>
    <noscript><main class="start-message">This page needs JavaScript.</main></noscript>
    <script type="module">
      // The runtime starts first: its wasm (preloaded above) compiles while the sign-in module loads. The app frame signs
      // in with a real form (public/frame-session.mjs); a page inside today's shell (?embed=1) doesn't load it.
      // Analytics reads its own data (public/frame-analytics.mjs), Home and Accounts the dashboard's
      // (public/frame-dashboard.mjs): each module loads on first use, at once on its own address.
      try {
        const wasm = '{{PKG}}/aac_web_bg.wasm';
        const runtime = import('{{PKG}}/aac_web.js');
        runtime.catch(() => {});
        // a server that doesn't say application/wasm: the runtime fetches it itself
        const compiled = WebAssembly.compileStreaming ? WebAssembly.compileStreaming(fetch(wasm)).catch(() => wasm) : Promise.resolve(wasm);
        if (!/[?&]embed=1(&|$)/.test(location.search)) {
          // A page's module, loaded once. Offline it is not asked for early (the start page opens on the stored copy, and
          // the browser keeps a failed module); a load that failed is asked for again under a new address next time.
          const loader = (path, early) => {
            let tries = 0;
            let pending = null;
            const load = () => {
              const p = import(tries++ ? `${path}?retry=${tries}` : path);
              p.catch(() => { if (pending === p) pending = null; });
              return (pending = p);
            };
            if (early && navigator.onLine !== false) load();
            return () => pending ?? load();
          };
          // The tab this address opens, as lib.rs page_from_location reads it (/app/<tab>, then ?view=, then the classic
          // app's addresses, else Home): its module is asked for at once.
          const startPage = ((path, search) => {
            const tab = (id) => /^(home|analytics|accounts|status|scoreboard)$/.test(id);
            const p = path.replace(/\/+$/, '');
            if (path === '/app' || path.startsWith('/app/')) return tab(p.split('/').pop()) ? p.split('/').pop() : 'status';
            const view = /[?&]view=([a-z]+)(&|$)/.exec(search)?.[1];
            if (tab(view)) return view;
            if (/^\/(analytics|accounts|status|scoreboard)$/.test(p)) return p.slice(1);
            return /^\/accounts\/[a-z0-9][a-z0-9-]{0,63}$/.test(p) ? 'accounts' : 'home';
          })(location.pathname, location.search);
          // the module; the page that asked installs its controller only if it is still there (analytics/feed.rs)
          window.aacLoadAnalytics = loader('/frame-analytics.mjs', startPage === 'analytics');
          window.aacLoadDashboard = loader('/frame-dashboard.mjs', startPage === 'home' || startPage === 'accounts');
          const { installFrameSession } = await import('/frame-session.mjs');
          installFrameSession(window);
        }
        const { installResetHints } = await import('/reset-live.mjs');
        installResetHints(window);
        const { default: init } = await runtime;
        await init({ module_or_path: await compiled });
      } catch {
        const message = document.createElement('main');
        message.className = 'start-message';
        message.textContent = 'This page could not start. Reload it, or update the browser.';
        document.body.replaceChildren(message);
      }
    </script>
  </body>
</html>
