<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AAC" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ECF0F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0C1217" media="(prefers-color-scheme: dark)" />
    <title>AI Account Center</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <script>if(self!==top||/[?&](embed|content)=1(&|$)/.test(location.search))document.documentElement.setAttribute('data-status-embedded','1');</script>
    <link rel="stylesheet" href="/status-bar.css" />
    <link rel="stylesheet" href="{{CSS}}" />
    <link rel="modulepreload" href="{{PKG}}/aac_web.js" />
    <link rel="preload" href="{{PKG}}/aac_web_bg.wasm" as="fetch" type="application/wasm" crossorigin />
  </head>
  <body>
    <noscript><main class="start-message">This page needs JavaScript.</main></noscript>
    <script type="module">
      // The runtime starts first: its wasm (preloaded above) compiles while the sign-in module loads. The app frame signs
      // in with a real form (public/frame-session.mjs); a page inside today's shell (?embed=1) doesn't load it.
      // Analytics reads its own data (public/frame-analytics.mjs), Home and Accounts the dashboard's
      // (public/frame-dashboard.mjs): each module loads on first use, at once on its own address.
      try {
        const wasm = '{{PKG}}/aac_web_bg.wasm';
        const runtime = import('{{PKG}}/aac_web.js');
        runtime.catch(() => {});
        // a server that doesn't say application/wasm: the runtime fetches it itself
        const compiled = WebAssembly.compileStreaming ? WebAssembly.compileStreaming(fetch(wasm)).catch(() => wasm) : Promise.resolve(wasm);
        if (!/[?&]embed=1(&|$)/.test(location.search)) {
          let analytics = /\/app\/analytics\/?$/.test(location.pathname) ? import('/frame-analytics.mjs') : null;
          analytics?.catch(() => {});
          // the module; the page that asked installs its controller only if it is still there (analytics/feed.rs)
          window.aacLoadAnalytics = () => (analytics ??= import('/frame-analytics.mjs'));
          let dashboard = /\/app\/(home|accounts)\/?$/.test(location.pathname) ? import('/frame-dashboard.mjs') : null;
          dashboard?.catch(() => {});
          window.aacLoadDashboard = () => (dashboard ??= import('/frame-dashboard.mjs')).then((m) => m.installFrameDashboard(window));
          const { installFrameSession } = await import('/frame-session.mjs');
          installFrameSession(window);
        }
        const { installResetHints } = await import('/reset-live.mjs');
        installResetHints(window);
        const { default: init } = await runtime;
        await init({ module_or_path: await compiled });
      } catch {
        const message = document.createElement('main');
        message.className = 'start-message';
        message.textContent = 'This page could not start. Reload it, or update the browser.';
        document.body.replaceChildren(message);
      }
    </script>
  </body>
</html>
