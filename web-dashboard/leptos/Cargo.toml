[package]
name = "aac-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
description = "AI Account Center web pages built with Leptos (client-side rendered)"
repository = "https://github.com/sittingmongoose/ai-account-center"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "=0.9.0-rc1", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Location", "Response", "Request", "RequestInit", "RequestCredentials", "RequestCache", "Headers", "MessageEvent", "WebSocket", "VisibilityState", "UrlSearchParams", "EventTarget", "Storage", "DomRect", "HtmlVideoElement", "HtmlMediaElement", "CssStyleDeclaration", "HtmlElement", "KeyboardEvent", "HtmlImageElement", "AbortController", "AbortSignal", "Event"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
