# The Slint crate one level up enables +tail-call for its own build (web-dashboard/.cargo/config.toml), and cargo
# joins rustflags arrays from parent config files. These pages need neither feature, and WebAssembly tail calls hit
# WebKit bug 325447 on iOS 27, so the later flag turns both off again for this crate.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=-tail-call,-simd128"]
