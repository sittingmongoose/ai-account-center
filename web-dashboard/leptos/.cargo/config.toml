# No WebAssembly tail calls or SIMD: the app needs neither, and tail calls hit WebKit bug 325447 on iOS 27. (Until the
# Slint crate one level up was retired, its config turned both on and cargo joined it with this one; the flags stay
# explicit so a parent config can never turn them back on.)
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=-tail-call,-simd128"]
