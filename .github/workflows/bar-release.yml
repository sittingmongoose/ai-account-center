name: AI Account Center macOS package

# Package the native app from this repository on demand. This workflow retains
# the Mac build inputs without publishing a floating release or invoking an
# upstream installer. macos-bar/VERSION is the app's version source.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-account-center-macos-package
  cancel-in-progress: false

jobs:
  package:
    name: Build AI Account Center for macOS
    if: github.repository == 'sittingmongoose/ai-account-center' && github.ref_name == github.event.repository.default_branch
    runs-on: [self-hosted, macos, ccs-bar]
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Read app version
        id: ver
        run: |
          version="$(tr -d '[:space:]' < macos-bar/VERSION)"
          if [ -z "$version" ]; then
            echo "::error file=macos-bar/VERSION::macos-bar/VERSION is empty"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package AI Account Center.app
        working-directory: macos-bar
        run: ./Scripts/package_app.sh "${{ steps.ver.outputs.version }}"

      - name: Upload app archive
        uses: actions/upload-artifact@v4
        with:
          name: AI-Account-Center-macos-${{ steps.ver.outputs.version }}
          path: macos-bar/dist/AI-Account-Center.app.zip
          retention-days: 14
          if-no-files-found: error
