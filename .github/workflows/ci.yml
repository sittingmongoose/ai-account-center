name: CI

on:
  pull_request:

permissions:
  contents: read

# Design notes:
# - Matrix parallelism cuts wall time from ~3-4min to ~60-90s (cache warm).
# - Concurrency group cancels superseded runs on the same ref (saves runner time on rapid pushes).
# - Build leg produces dist/ artifact; test leg downloads it instead of rebuilding (DRY).
# - fail-fast: false so every failure is visible in one run (no re-pushing to see the next failure).

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      contains(fromJSON('["COLLABORATOR","MEMBER","OWNER"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    env:
      # Keep Bun cache isolated per job workspace so parallel jobs
      # do not race on ~/.bun/install/cache and corrupt restore/install state.
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.bun/install/cache
    strategy:
      fail-fast: false
      matrix:
        check:
          - { name: typecheck, cmd: 'bun run typecheck' }
          - { name: lint, cmd: 'bun run lint' }
          - { name: format, cmd: 'bun run format:check' }
          - { name: personal-details, cmd: 'node scripts/personal-detail-guard.js' }
    name: ${{ matrix.check.name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore bun package cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: ${{ runner.os }}-bun-cache-v3-${{ hashFiles('bun.lock', 'web-dashboard/Cargo.lock') }}

      - name: Ensure dependencies
        run: bash scripts/ensure-deps.sh

      - name: Run ${{ matrix.check.name }}
        run: ${{ matrix.check.cmd }}

  build:
    if: >-
      contains(fromJSON('["COLLABORATOR","MEMBER","OWNER"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    name: build
    env:
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.bun/install/cache
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore bun package cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: ${{ runner.os }}-bun-cache-v3-${{ hashFiles('bun.lock', 'web-dashboard/Cargo.lock') }}

      - name: Ensure dependencies
        run: bash scripts/ensure-deps.sh

      - name: Setup pinned Rust browser toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.98.0'
          targets: wasm32-unknown-unknown
          components: rustfmt

      - name: Setup pinned wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Build
        run: bun run build:all

      - name: Validate Slint dashboard
        run: bun run ui:validate

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  test:
    if: >-
      contains(fromJSON('["COLLABORATOR","MEMBER","OWNER"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    name: test
    needs: [build]
    env:
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.bun/install/cache
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore bun package cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: ${{ runner.os }}-bun-cache-v3-${{ hashFiles('bun.lock', 'web-dashboard/Cargo.lock') }}

      - name: Ensure dependencies
        run: bash scripts/ensure-deps.sh

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Test
        run: bun run test:all

      - name: Test offline Claude quota collector
        shell: bash
        run: |
          set -euo pipefail
          TEST_FIXTURE_ROOT="$(mktemp -d "${TMPDIR:-/tmp}/ai-account-center-claude-ci.XXXXXX")"
          trap 'rm -rf "$TEST_FIXTURE_ROOT"' EXIT
          mkdir -p "$TEST_FIXTURE_ROOT/.ccs" "$TEST_FIXTURE_ROOT/.config" \
            "$TEST_FIXTURE_ROOT/.cache" "$TEST_FIXTURE_ROOT/.state"
          env -i PATH="$PATH" HOME="$TEST_FIXTURE_ROOT" USERPROFILE="$TEST_FIXTURE_ROOT" \
            CCS_HOME="$TEST_FIXTURE_ROOT" XDG_CONFIG_HOME="$TEST_FIXTURE_ROOT/.config" \
            XDG_CACHE_HOME="$TEST_FIXTURE_ROOT/.cache" XDG_STATE_HOME="$TEST_FIXTURE_ROOT/.state" \
            TMPDIR="${TMPDIR:-/tmp}" LANG="${LANG:-C.UTF-8}" TZ=UTC NODE_ENV=test \
            PYTHONDONTWRITEBYTECODE=1 python3 tests/unit/account-usage/claude_usage_test.py

  # Single always-reporting status that branch protection requires.
  #
  # The validate/build/test jobs are gated to trusted author associations so
  # source execution remains restricted to trusted contributors. A job skipped
  # by a job-level `if` reports no status, so requiring those job names directly
  # leaves fork PRs stuck on "Expected - waiting for status to be reported"
  # forever. Requiring this gate instead keeps the contract satisfiable:
  #   - trusted PR: gate is green only if every gated job actually succeeded
  #   - fork PR:    gated jobs skip, gate reports green so the PR is mergeable
  #                 (fork code is still reviewed by a maintainer before merge)
  #
  # No checkout here: the gate only inspects upstream job results, so it runs no
  # third-party code.
  ci-gate:
    if: always()
    needs: [validate, build, test]
    runs-on: ubuntu-latest
    name: CI Gate
    steps:
      - name: Verify gated jobs did not fail
        env:
          VALIDATE: ${{ needs.validate.result }}
          BUILD: ${{ needs.build.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "validate=$VALIDATE build=$BUILD test=$TEST"
          for result in "$VALIDATE" "$BUILD" "$TEST"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "[X] A required CI job did not pass (result: $result)"
              exit 1
            fi
          done
          echo "[OK] CI gate satisfied (success or skipped-for-fork)"
