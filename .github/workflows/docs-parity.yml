name: Docs – Parity and Freshness

on:
  push:
    paths:
      - 'docs/quickstart-snippet.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'CLAUDE.md'
      - 'LICENSE'
      - 'assets/**'
      - 'tests/**/README.md'
      - 'tests/README.md'
      - 'web-dashboard/README.md'
      - 'windows-bar/README.md'
      - 'docker/README.md'
      - 'macos-bar/README.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'tests/docs/quickstart-parity.sh'
      - 'tests/docs/documentation-freshness.js'
      - 'crates/aac-xtask/**'
      - '.github/workflows/docs-parity.yml'
  pull_request:
    paths:
      - 'docs/quickstart-snippet.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'CLAUDE.md'
      - 'LICENSE'
      - 'assets/**'
      - 'tests/**/README.md'
      - 'tests/README.md'
      - 'web-dashboard/README.md'
      - 'windows-bar/README.md'
      - 'docker/README.md'
      - 'macos-bar/README.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'tests/docs/quickstart-parity.sh'
      - 'tests/docs/documentation-freshness.js'
      - 'crates/aac-xtask/**'
      - '.github/workflows/docs-parity.yml'

permissions:
  contents: read

jobs:
  docs-parity:
    name: Assert documentation parity and freshness
    if: >-
      contains(fromJSON('["COLLABORATOR","MEMBER","OWNER"]'), github.event.pull_request.author_association)
      || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pinned Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.99.1'

      - name: Run quickstart parity check
        run: cargo run --locked -p aac-xtask -- check quickstart

      - name: Validate documentation pointers and relative links
        run: cargo run --locked -p aac-xtask -- check docs
