name: Push CI

on:
  push:

permissions:
  contents: read

concurrency:
  group: push-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.bun/install/cache
    strategy:
      fail-fast: false
      matrix:
        check:
          - { name: typecheck, cmd: 'bun run typecheck' }
          - { name: lint, cmd: 'bun run lint' }
          - { name: format, cmd: 'bun run format:check' }
    name: ${{ matrix.check.name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore bun package cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: ${{ runner.os }}-bun-cache-v3-${{ hashFiles('bun.lock', 'web-dashboard/Cargo.lock') }}

      - name: Ensure dependencies
        run: bash scripts/ensure-deps.sh

      - name: Run ${{ matrix.check.name }}
        run: ${{ matrix.check.cmd }}

  build:
    runs-on: ubuntu-latest
    name: build
    env:
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.bun/install/cache
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore bun package cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: ${{ runner.os }}-bun-cache-v3-${{ hashFiles('bun.lock', 'web-dashboard/Cargo.lock') }}

      - name: Ensure dependencies
        run: bash scripts/ensure-deps.sh

      - name: Setup pinned Rust browser toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.98.0'
          targets: wasm32-unknown-unknown
          components: rustfmt

      - name: Setup pinned wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Build
        run: bun run build:all

      - name: Validate Slint dashboard
        run: bun run ui:validate

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    name: test
    needs: [build]
    env:
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.bun/install/cache
      FAST_TEST_BUDGET_SECONDS: '90'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore bun package cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: ${{ runner.os }}-bun-cache-v3-${{ hashFiles('bun.lock', 'web-dashboard/Cargo.lock') }}

      - name: Ensure dependencies
        run: bash scripts/ensure-deps.sh

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Test fast bucket with perf budget
        shell: bash
        run: |
          set -euo pipefail

          start_epoch=$(date +%s)
          test_status=0
          if bun run test:fast; then
            test_status=0
          else
            test_status=$?
          fi
          end_epoch=$(date +%s)
          elapsed_seconds=$((end_epoch - start_epoch))

          {
            echo "### test:fast perf budget"
            echo ""
            echo "- Elapsed: ${elapsed_seconds}s"
            echo "- Budget: ${FAST_TEST_BUDGET_SECONDS}s"
          } >> "$GITHUB_STEP_SUMMARY"

          if (( elapsed_seconds > FAST_TEST_BUDGET_SECONDS )); then
            echo "::warning::test:fast took ${elapsed_seconds}s (budget ${FAST_TEST_BUDGET_SECONDS}s) - check for undeclared slow tests in scripts/run-test-bucket.js"
            echo "- Result: warning emitted. Check for undeclared slow tests in scripts/run-test-bucket.js." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Result: within budget." >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$test_status"

      - name: Test slow bucket
        run: bun run test:slow

      - name: Test offline Claude quota collector
        shell: bash
        run: |
          set -euo pipefail
          TEST_FIXTURE_ROOT="$(mktemp -d "${TMPDIR:-/tmp}/ai-account-center-claude-ci.XXXXXX")"
          trap 'rm -rf "$TEST_FIXTURE_ROOT"' EXIT
          mkdir -p "$TEST_FIXTURE_ROOT/.ccs" "$TEST_FIXTURE_ROOT/.config" \
            "$TEST_FIXTURE_ROOT/.cache" "$TEST_FIXTURE_ROOT/.state"
          env -i PATH="$PATH" HOME="$TEST_FIXTURE_ROOT" USERPROFILE="$TEST_FIXTURE_ROOT" \
            CCS_HOME="$TEST_FIXTURE_ROOT" XDG_CONFIG_HOME="$TEST_FIXTURE_ROOT/.config" \
            XDG_CACHE_HOME="$TEST_FIXTURE_ROOT/.cache" XDG_STATE_HOME="$TEST_FIXTURE_ROOT/.state" \
            TMPDIR="${TMPDIR:-/tmp}" LANG="${LANG:-C.UTF-8}" TZ=UTC NODE_ENV=test \
            PYTHONDONTWRITEBYTECODE=1 python3 tests/unit/account-usage/claude_usage_test.py
