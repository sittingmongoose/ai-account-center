name: Push CI

on:
  push:

permissions:
  contents: read

concurrency:
  group: push-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.bun/install/cache
    strategy:
      fail-fast: false
      matrix:
        check:
          - { name: personal-details, cmd: 'cargo run --locked -p aac-xtask -- check personal' }
          - { name: test-inventory, cmd: 'cargo run --locked -p aac-xtask -- check inventory' }
    name: ${{ matrix.check.name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Restore bun package cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: ${{ runner.os }}-bun-cache-v3-${{ hashFiles('bun.lock', 'web-dashboard/Cargo.lock') }}

      - name: Setup pinned Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.99.1'

      - name: Ensure dependencies
        run: bun install --frozen-lockfile

      - name: Run ${{ matrix.check.name }}
        run: ${{ matrix.check.cmd }}

  build:
    runs-on: ubuntu-latest
    name: build
    env:
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.bun/install/cache
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Restore bun package cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: ${{ runner.os }}-bun-cache-v3-${{ hashFiles('bun.lock', 'web-dashboard/Cargo.lock') }}

      - name: Ensure dependencies
        run: bun install --frozen-lockfile

      - name: Setup pinned Rust browser toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.99.1'
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Setup pinned wasm-pack
        run: cargo install wasm-pack --version 0.15.1 --locked

      - name: Build
        run: bun run build:all

      - name: Validate Leptos dashboard
        run: bun run ui:validate

      # The spec suite (tests/spec/read-http-parity.ts) needs the real history store module, as
      # the landing gate builds it (scripts/ci-parity-gate.sh). Build both Linux modules here and
      # ship them to the test job in dist/native.
      - name: Restore native module build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            crates/aac-store/target
            crates/aac-status/target
          key: ${{ runner.os }}-native-cargo-v2-${{ hashFiles('Cargo.lock', 'crates/aac-store/rust-toolchain.toml', 'crates/aac-status/rust-toolchain.toml') }}

      - name: Build native history store and status readers
        run: |
          bun run store:build
          bun run status:build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    name: test
    needs: [build]
    env:
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.bun/install/cache
      FAST_TEST_BUDGET_SECONDS: '90'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Restore bun package cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: ${{ runner.os }}-bun-cache-v3-${{ hashFiles('bun.lock', 'web-dashboard/Cargo.lock') }}

      - name: Ensure dependencies
        run: bun install --frozen-lockfile

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # upload/download-artifact drop the executable bit, so the native launcher the tests spawn
      # fails with EACCES (every Push CI run since the Rust cut). Restore it on the shipped binaries.
      - name: Restore executable bits on native binaries
        run: |
          find dist/native dist/agent -type f ! -name '*.node' ! -name '*.json' ! -name '*.md' ! -name '*.txt' -exec chmod +x {} + 2>/dev/null || true
          ls -l dist/native | head -20

      - name: Test fast bucket with perf budget
        shell: bash
        run: |
          set -euo pipefail

          start_epoch=$(date +%s)
          test_status=0
          if bun run test:fast; then
            test_status=0
          else
            test_status=$?
          fi
          end_epoch=$(date +%s)
          elapsed_seconds=$((end_epoch - start_epoch))

          {
            echo "### test:fast perf budget"
            echo ""
            echo "- Elapsed: ${elapsed_seconds}s"
            echo "- Budget: ${FAST_TEST_BUDGET_SECONDS}s"
          } >> "$GITHUB_STEP_SUMMARY"

          if (( elapsed_seconds > FAST_TEST_BUDGET_SECONDS )); then
            echo "::warning::test:fast took ${elapsed_seconds}s (budget ${FAST_TEST_BUDGET_SECONDS}s) - check for undeclared slow tests in scripts/run-test-bucket.js"
            echo "- Result: warning emitted. Check for undeclared slow tests in scripts/run-test-bucket.js." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Result: within budget." >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$test_status"

      - name: Test slow bucket
        run: bun run test:slow

      - name: Test offline Qwen plan collector
        shell: bash
        run: |
          set -euo pipefail
          TEST_FIXTURE_ROOT="$(mktemp -d "${TMPDIR:-/tmp}/ai-account-center-qwen-ci.XXXXXX")"
          trap 'rm -rf "$TEST_FIXTURE_ROOT"' EXIT
          mkdir -p "$TEST_FIXTURE_ROOT/.ccs" "$TEST_FIXTURE_ROOT/.config" \
            "$TEST_FIXTURE_ROOT/.cache" "$TEST_FIXTURE_ROOT/.state"
          env -i PATH="$PATH" HOME="$TEST_FIXTURE_ROOT" USERPROFILE="$TEST_FIXTURE_ROOT" \
            CCS_HOME="$TEST_FIXTURE_ROOT" XDG_CONFIG_HOME="$TEST_FIXTURE_ROOT/.config" \
            XDG_CACHE_HOME="$TEST_FIXTURE_ROOT/.cache" XDG_STATE_HOME="$TEST_FIXTURE_ROOT/.state" \
            TMPDIR="${TMPDIR:-/tmp}" LANG="${LANG:-C.UTF-8}" TZ=UTC NODE_ENV=test \
            PYTHONDONTWRITEBYTECODE=1 python3 tests/unit/account-usage/plan_usage_test.py
