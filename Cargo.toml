[workspace]
members = ["crates/*"]
exclude = ["native/aac-usage", "native/aac-cursor-account", "web-dashboard", "web-dashboard/leptos"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/sittingmongoose/ai-account-center"
publish = false

[workspace.dependencies]
aac-api = { path = "crates/aac-api" }
aac-diag = { path = "crates/aac-diag" }
aac-core = { path = "crates/aac-core" }
aac-protocol = { path = "crates/aac-protocol" }
aac-providers = { path = "crates/aac-providers" }
aac-files = { path = "crates/aac-files" }
aac-num = { path = "crates/aac-num" }
aac-config = { path = "crates/aac-config" }
aac-transport = { path = "crates/aac-transport" }
aac-views = { path = "crates/aac-views" }
aac-snapshot = { path = "crates/aac-snapshot" }
# R3: the store and Status crates joined the workspace (one lock for the host and the NAPI
# modules). Dependents take them without the Node binding; the `.node` builds use each
# package's own default features.
aac-store = { path = "crates/aac-store", default-features = false }
aac-status = { path = "crates/aac-status", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = "2"
sha2 = "0.11"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case"] }
tempfile = "3"
fs2 = "0.4"
libc = "0.2"
serde_yaml = "0.9"
yaml-rust2 = { version = "0.13", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "time", "sync", "test-util"] }
tokio-util = { version = "0.7", features = ["rt"] }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"

# R3: the release settings the store and Status NAPI modules carried as standalone crates.
# Only the workspace root's profile applies to members, so they live here now.
[profile.release]
lto = true
opt-level = 3
strip = true
codegen-units = 1

# Keep reproducible dev/test artifacts below the transport's existing 64 MiB guard.
[profile.dev]
debug = 0

[profile.test]
debug = 0

# L1: the service hashes its own executable at start (build check); keep that fast in dev/test
# builds too.
[profile.dev.package.sha2]
opt-level = 3
