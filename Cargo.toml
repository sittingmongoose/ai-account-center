[workspace]
members = ["crates/*"]
exclude = ["native/aac-store", "native/aac-status", "native/aac-usage", "native/aac-cursor-account", "web-dashboard", "web-dashboard/leptos"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/sittingmongoose/ai-account-center"
publish = false

[workspace.dependencies]
aac-core = { path = "crates/aac-core" }
aac-protocol = { path = "crates/aac-protocol" }
aac-files = { path = "crates/aac-files" }
aac-config = { path = "crates/aac-config" }
aac-transport = { path = "crates/aac-transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case"] }
tempfile = "3"
fs2 = "0.4"
libc = "0.2"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "time", "sync", "test-util"] }
tokio-util = { version = "0.7", features = ["rt"] }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"

